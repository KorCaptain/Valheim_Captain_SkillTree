## 【발사 화살 수】
## 멀티샷 시 한 번에 발사되는 화살의 개수입니다.
## 더 많은 화살로 광역 피해를 가합니다.
## 권장값: 4-7개
# Setting type: Int32
# Default value: 5
Archer_MultiShot_ArrowCount = 5

## 【화살 소모량】
## 멀티샷 사용 시 소모되는 화살의 개수입니다.
## 적은 소모로 효율적인 공격이 가능합니다.
## 권장값: 1-2개
# Setting type: Int32
# Default value: 1
Archer_MultiShot_ArrowConsumption = 1

## 【화살당 피해 비율 (%)】
## 각 화살이 가하는 피해의 비율입니다.
## 기본 활 공격력 대비 비율입니다.
## 권장값: 40-60%
# Setting type: Single
# Default value: 50
Archer_MultiShot_DamagePercent = 10

## 【쿨타임 (초)】
## 멀티샷 재사용 대기 시간입니다.
## 짧을수록 자주 사용할 수 있습니다.
## 권장값: 25-40초
# Setting type: Single
# Default value: 30
Archer_MultiShot_Cooldown = 30

## 【발사 회수】
## 멀티샷을 연속으로 사용할 수 있는 횟수입니다.
## 여러 번 발사하여 화력을 집중할 수 있습니다.
## 권장값: 2-4회
# Setting type: Int32
# Default value: 2
Archer_MultiShot_Charges = 2

## 【스태미나 소모】

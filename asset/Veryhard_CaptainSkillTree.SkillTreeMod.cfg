
[- Captain Level System -]

## 자체 레벨 시스템 활성화 여부
## EpicMMOSystem이 감지되면 자동으로 비활성화됩니다.
## [기본: true]
# Setting type: Boolean
# Default value: true
Enable Captain Level System = true

## 최대 레벨
## [기본: 100, 범위: 1-999]
# Setting type: Int32
# Default value: 100
Max Level = 100

## 기본 경험치 (레벨 1에서 2로 올리는데 필요한 경험치)
## [기본: 300]
# Setting type: Int32
# Default value: 300
Base Level Exp = 300

## 다음 레벨 경험치 배수
## 레벨이 오를수록 필요 경험치가 이 배수만큼 증가합니다.
## [기본: 1.05]
# Setting type: Single
# Default value: 1.05
Multi Next Level = 1.05

## 경험치 배율
## 획득하는 모든 경험치에 적용됩니다.
## [기본: 1.0, 범위: 0.1-10.0]
# Setting type: Single
# Default value: 1
Exp Rate = 1

## 누적 경험치 모드
## true: 필요 경험치 = (이전 필요 경험치 * 배수) + 기본 경험치
## false: 필요 경험치 = 이전 필요 경험치 * 배수
## [기본: true]
# Setting type: Boolean
# Default value: true
Cumulative Exp Mode = true

## 최대 레벨 차이
## 플레이어 레벨 + 이 값보다 높은 몬스터는 경험치가 감소합니다.
## [기본: 10]
# Setting type: Int32
# Default value: 10
Max Level Exp Range = 10

## 최소 레벨 차이
## 플레이어 레벨 - 이 값보다 낮은 몬스터는 경험치가 감소합니다.
## [기본: 10]
# Setting type: Int32
# Default value: 10
Min Level Exp Range = 10

## 범위 밖 경험치 점진적 감소
## 범위 밖 몬스터의 경험치가 거리에 따라 점진적으로 감소합니다.
## [기본: false]
# Setting type: Boolean
# Default value: false
Curve Exp Outside Range = false

## 범위 밖 경험치 0
## 범위 밖 몬스터의 경험치가 0이 됩니다.
## [기본: false]
# Setting type: Boolean
# Default value: false
No Exp Past Level Range = false

## 별 레벨 경험치 배수
## 몬스터 별 1개당 추가 경험치 배율입니다.
## 예: 1성 몬스터 = 기본 경험치 + (최대 경험치 * 이 값 * 1)
## [기본: 1.5]
# Setting type: Single
# Default value: 1.5
Star Level Exp Multiplier = 1.5

## 별당 몬스터 레벨 증가
## true: 1성 몬스터는 기본 레벨 + 1로 표시됩니다.
## 예: Lv.10 몬스터가 1성이면 Lv.11로 표시
## [기본: true]
# Setting type: Boolean
# Default value: true
Mob Level Per Star = true

## 경험치 획득 시 팝업 표시
## [기본: true]
# Setting type: Boolean
# Default value: true
Show Exp Popup = true

## 레벨업 시 이펙트 표시
## [기본: true]
# Setting type: Boolean
# Default value: true
Show Level Up Effect = true

## 레벨/경험치 바 HUD 표시
## [기본: true]
# Setting type: Boolean
# Default value: true
Show Level HUD = true

## HP 바 색상 (HTML 16진수)
## [기본: #870000]
# Setting type: String
# Default value: #870000
HUD HP Color = #870000

## 스태미나 바 색상 (HTML 16진수)
## [기본: #986100]
# Setting type: String
# Default value: #986100
HUD Stamina Color = #986100

## 에이트르 바 색상 (HTML 16진수)
## [기본: #84257C]
# Setting type: String
# Default value: #84257C
HUD Eitr Color = #84257C

## 경험치 바 색상 (HTML 16진수)
## [기본: #C87820]
# Setting type: String
# Default value: #C87820
HUD Exp Color = #C87820

## HUD 전체 스케일
## [기본: 1.0, 범위: 0.5-3.0]
# Setting type: Single
# Default value: 1
HUD Scale = 1

## 레벨당 스킬 포인트 획득량
## [기본: 2, 범위: 1-10]
# Setting type: Int32
# Default value: 2
Skill Points Per Level = 2

## 스킬포인트 기반 레벨 계산 사용
## EpicMMO가 없을 때 사용한 스킬 포인트를 기준으로 레벨을 계산합니다.
## 예: 102 포인트 사용 / 2 = 51레벨
## [기본: true]
# Setting type: Boolean
# Default value: true
Use Skill Point Based Level = true

## 레벨당 필요 스킬 포인트
## 스킬포인트 기반 레벨 계산 시 사용됩니다.
## 예: 102 포인트 / 2 = 51레벨
## [기본: 2, 범위: 1-10]
# Setting type: Int32
# Default value: 2
Points Required Per Level = 2

## EpicMMO 자동 동기화
## EpicMMO 설치 시 스킬포인트 기반 레벨을 EpicMMO에 동기화합니다.
## [기본: true]
# Setting type: Boolean
# Default value: true
Auto Sync To EpicMMO = true

## 탈출 버튼 표시 여부 (관리자 전용)
## 스킬트리 UI에 탈출 버튼을 표시합니다.
## ⚠️ 관리자만 변경 가능. 서버 설정이 모든 클라이언트에 동기화됩니다.
## [기본: false]
# Setting type: Boolean
# Default value: false
Exit Button = false

## JSON 기본 파일 생성 여부
## true로 설정 시 BepInEx/config/CaptainSkillTree/ 폴더에
## MonsterExp.json, LevelExp.json 기본 파일이 생성됩니다.
## (이미 파일이 있으면 덮어쓰지 않음)
## [기본: true]
# Setting type: Boolean
# Default value: true
Generate JSON Files = true


